<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学应用题求解系统框架</title>
</head>
<body>
    <svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
        <!-- 这里粘贴你的SVG代码 -->
        <?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <!-- 框架整体结构 -->
    <rect x="50" y="50" width="700" height="500" fill="none" stroke="black" stroke-width="2"/>
    <text x="280" y="40" font-size="18" font-weight="bold">数学应用题求解系统</text>

    <!-- 固定工作流程层 -->
    <rect x="100" y="100" width="600" height="350" fill="none" stroke="black" stroke-width="2"/>
    <text x="320" y="90" font-size="16" font-weight="bold">固定工作流程</text>

    <!-- 智能体模块 -->
    <rect x="150" y="130" width="500" height="60" fill="#E6E6FA" stroke="black" stroke-width="2"/>
    <text x="260" y="160" font-size="14">问题分析智能体（PA）</text>
    <text x="260" y="180" font-size="12">f: T → M</text>

    <rect x="150" y="200" width="500" height="60" fill="#FFD700" stroke="black" stroke-width="2"/>
    <text x="260" y="230" font-size="14">策略分析智能体（SA）</text>
    <text x="260" y="250" font-size="12">g: M → S</text>

    <rect x="150" y="270" width="500" height="60" fill="#90EE90" stroke="black" stroke-width="2"/>
    <text x="260" y="300" font-size="14">计算执行智能体（CA）</text>
    <text x="260" y="320" font-size="12">h: S → R</text>

    <rect x="150" y="340" width="500" height="60" fill="#FFB6C1" stroke="black" stroke-width="2"/>
    <text x="260" y="370" font-size="14">验证智能体（VA）</text>
    <text x="260" y="390" font-size="12">v: R × M → {0, 1}</text>

    <!-- 工具层 -->
    <rect x="250" y="460" width="300" height="70" fill="#ADD8E6" stroke="black" stroke-width="2"/>
    <text x="320" y="490" font-size="14">数学工具模块（MT）</text>
    <text x="300" y="510" font-size="12">提供计算工具，支持信息交换</text>

    <!-- 数据交互格式 -->
    <text x="80" y="150" font-size="12">D1</text>
    <line x1="120" y1="160" x2="150" y2="160" stroke="black" stroke-width="2"/>

    <text x="80" y="220" font-size="12">D2</text>
    <line x1="120" y1="230" x2="150" y2="230" stroke="black" stroke-width="2"/>

    <text x="80" y="290" font-size="12">D3</text>
    <line x1="120" y1="300" x2="150" y2="300" stroke="black" stroke-width="2"/>

    <text x="80" y="360" font-size="12">D4</text>
    <line x1="120" y1="370" x2="150" y2="370" stroke="black" stroke-width="2"/>

    <!-- 连接工具层 -->
    <line x1="400" y1="400" x2="400" y2="460" stroke="black" stroke-width="2"/>
</svg>


    </svg>
</body>
</html>
